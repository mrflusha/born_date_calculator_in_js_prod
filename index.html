<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" type="text/css" href="css/styles.css">
	<title></title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
    <div id = 'LOL'>
      <span class="spinner" display = "none"></span>
  </div>

	<div id = 'body'>
		<div id = 'input'>
			<form>
        <div id="prev_text"><p>Узнай дату родов!</p></div>
        <p>Введите дату зачатия:</p>
				<input id='date' type="date" name="" required pattern="\d{4}-\d{2}-\d{2}" max="3000-12-31" >
        <div id="picture"></div>
				<button id = 'active_button' type="button">Узнать</button>
				
			</form>
		</div>

	</div>


    <div id = "loaded_screen">
        <div id="free_block"></div>
        <div id = 'born_day'>
          <p>Примерная дата рождения:</p>
          <div id = "born_value">12/12/12</div>
        </div>
        <div id = 'hospitality_date'>
          <p>Примерная дата начала декрета:</p>
            <div id = "dec_value">12/12/12</div>

        </div>
        <div id = 'loaded_buttons'>         
                <div id = 'wallpostbutton'><button id="wallpost_button">Опубликовать на стене</button></div>
                <div id = 'return'><button id = 'return_button'>Вернуться в начало</button></div>
        </div>
    </div>

    <div id="empty_input" >
      <div id = 'empty_input_block' >Вы не ввели дату, либо сервер недоступен</div>
    </div>

    <div id = "adv_block_flex">
      <div id="adv_block"></div>
    </div>  

<script type="text/javascript" src="script.js">



</script>

</body>
</html>
